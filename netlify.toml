# Publish the demo at /, the player at /module/, and a /demo/ copy for absolute asset paths.
[build]
  command = "bash scripts/vercel-public.sh"
  publish = "public"

# Broken absolute paths that judges/users hit on the static host.
[[redirects]]
  from = "/api/docs"
  to = "/api/docs/"
  status = 301

[[redirects]]
  from = "/docs"
  to = "/docs/le-hulum-srs.pdf"
  status = 302

[[redirects]]
  from = "/docs/"
  to = "/docs/le-hulum-srs.pdf"
  status = 302
