<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onDragOver="{{ over }}" onDrop="{{ drop }}" style="position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit;background:#14110F">
  <sc-if value="{{ hasPhoto }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="{{ photoStyle }}"></div></sc-if>
  <sc-if value="{{ noPhoto }}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 18%,#4A3524,#17120E 72%);overflow:hidden">
      <span style="position:absolute;left:50%;top:20%;transform:translateX(-50%);width:32%;aspect-ratio:1;border-radius:50%;background:linear-gradient(180deg,#6B5039,#3E2D20)"></span>
      <span style="position:absolute;left:50%;top:49%;transform:translateX(-50%);width:80%;height:62%;border-radius:46% 46% 0 0;background:linear-gradient(180deg,#5A412D,#2A1F17)"></span>
      <sc-if value="{{ showHint }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;font:600 12px/1.3 'JetBrains Mono',monospace;color:#F7F1E8;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px">drop signer photo</span></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ hasState }}" hint-placeholder-val="{{ false }}"><span style="{{ stateStyle }}"><span aria-hidden="true" style="{{ dotStyle }}"></span>{{ stateLabel }}</span></sc-if>
  <sc-if value="{{ hasWord }}" hint-placeholder-val="{{ false }}"><span style="{{ wordStyle }}">{{ word }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:320},&quot;photo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;word&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;VARIABLE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;live&quot;,&quot;waiting&quot;,&quot;nosign&quot;,&quot;rest&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stateLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Signing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onPhoto&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(f: File) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, photo = p.photo || '', small = !!p.compact;
    const st = p.state || '';
    const col = { live:'#7EE0A6', waiting:'#F4B740', nosign:'#FF9AA8', rest:'#D2C7B8' }[st] || '#D2C7B8';
    return {
      hasPhoto: !!photo, noPhoto: !photo, showHint: !small && !p.word,
      photoStyle: `position:absolute;inset:0;background:url(${photo}) center 25%/cover no-repeat`,
      hasState: !!p.stateLabel, stateLabel: p.stateLabel || '',
      stateStyle: `position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.72);color:#FFFFFF;font:700 ${small ? 12 : 13}px/1.3 'Atkinson Hyperlegible Next','Atkinson Hyperlegible',sans-serif;white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis`,
      dotStyle: `width:8px;height:8px;border-radius:50%;background:${col};flex:none`,
      hasWord: !!p.word, word: p.word || '',
      wordStyle: `position:absolute;left:50%;bottom:8px;transform:translateX(-50%);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 10px;border-radius:8px;background:#F4B740;color:#1A1206;font:700 ${small ? 12 : 14}px/1.3 'JetBrains Mono','Noto Sans Ethiopic',monospace`,
      over: e => { e.preventDefault(); },
      drop: e => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f && p.onPhoto) p.onPhoto(f); }
    };
  }
}
</script>
</body>
</html>
