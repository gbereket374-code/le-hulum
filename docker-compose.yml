# NFR-SUS-03: One command brings up the web server and the API.
services:
  web:
    build: ./nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./savanna:/srv/savanna:ro
      - ./module:/srv/module:ro
      - ./demo:/srv/demo:ro
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    expose:
      - "8000"
