<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>LE HULUM plugin test</title>
<script type="module">
  import { HOST, API, MODULE } from './config.js';
  await import(MODULE);
  const p = document.createElement('db-player');
  p.setAttribute('src', `${HOST}/demo/data/lesson.mp4`);
  p.setAttribute('poster', `${HOST}/demo/data/lesson-poster.webp`);
  p.setAttribute('captions', `${HOST}/demo/data/lesson.am.vtt,${HOST}/demo/data/lesson.en.vtt`);
  p.setAttribute('sign', `${HOST}/demo/data/sign.json`);
  p.setAttribute('glossary', `${HOST}/demo/data/glossary.json`);
  p.setAttribute('lang', 'am');
  document.getElementById('mount').prepend(p);
  const pin = document.createElement('db-sign-pin');
  pin.setAttribute('api', API);
  pin.setAttribute('lang', 'am');
  pin.setAttribute('scope', '#line');
  document.getElementById('mount').appendChild(pin);
</script>
</head>
<body>
<div id="mount">
  <article id="line"><p>ኮዱ ካልሰራ፣ ስህተቱን አረጋግጡ።</p></article>
</div>
</body>
</html>
