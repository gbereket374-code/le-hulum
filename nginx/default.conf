# C-02, INT-02, FR-HOH-02: Serve Savanna, the module and the demo, and proxy /api/.
server {
    listen 80;
    server_name _;
    charset utf-8;

    location / {
        root /srv/savanna;
        index index.html;
    }

    location = /module/sw.js {
        alias /srv/module/sw.js;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location /module/ {
        alias /srv/module/;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location /demo/ {
        alias /srv/demo/;
        add_header Access-Control-Allow-Origin "*";
        # Design .dc.html and SPA assets change often during demos; never serve stale UI.
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
    }
}
